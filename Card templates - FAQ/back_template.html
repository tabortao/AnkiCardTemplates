<!-- 英语学习卡片 - 背面模板 -->
<div class="card english-learning">
    <!-- 答案标题 -->
    <div class="answer-header">
        <div class="success-icon">🎉</div>
        <h2 class="answer-title">Great! Here's the Answer</h2>
    </div>

    <!-- 分隔线 -->
    <hr id="answer">

    <!-- 音频区域 -->
    <div class="audio-section">
        <div class="section-header">
            <span class="section-icon">🎵</span>
            <h3>英文发音</h3>
        </div>
        <div class="audio-container">
            {{音频}}
        </div>
    </div>

    <!-- 句子区域 -->
    <div class="sentence-section">
        <div class="section-header">
            <span class="section-icon">📝</span>
            <h3>英文句子</h3>
        </div>
        <div class="sentence-content">
            {{句子}}
        </div>
    </div>

    <!-- 翻译区域 -->
    <div class="translation-section">
        <div class="section-header">
            <span class="section-icon">🈶</span>
            <h3>中文翻译</h3>
        </div>
        <div class="translation-content">
            {{翻译}}
        </div>
    </div>

    <!-- 鼓励区域 -->
    <div class="encouragement">
        <div class="trophy-icon">🏆</div>
        <p class="encourage-text">Keep going! You're doing great!</p>
        <p class="encourage-text-chinese">继续加油！你做得很棒！</p>
    </div>

    <!-- 装饰星星 -->
    <div class="decoration-stars">
        <div class="star star-1">⭐</div>
        <div class="star star-2">✨</div>
        <div class="star star-3">🌟</div>
    </div>
</div>
