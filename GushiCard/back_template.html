<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>
<div class="card gushi-card">
  <div class="answer-header">
    <div class="success-icon">🎉</div>
    <h2 class="answer-title">古诗学习</h2>
  </div>

  <hr id="answer" />

  <div class="meta-line">{{朝代}}·{{作者}}</div>
  <div class="index-chip">序号：{{序号}}</div>

  <div class="audio-section">
    <div class="section-header">
      <span class="section-icon">🔊</span>
      <h3>古诗音频</h3>
    </div>
    <div class="audio-container">{{古诗音频}}</div>
    <div class="audio-controls"><button class="action-button small" id="playPoemAudioBtn">播放</button></div>
  </div>

  <div class="poem-section">
    <div class="section-header">
      <span class="section-icon">📜</span>
      <h3>古诗内容</h3>
    </div>
    <div class="poem-content">{{古诗内容}}</div>
  </div>

  <div class="explain-section">
    <div class="section-header">
      <span class="section-icon">🧠</span>
      <h3>古诗解读</h3>
    </div>
    <div class="explain-content">{{古诗解读}}</div>
  </div>

  <div class="background-section">
    <div class="section-header">
      <span class="section-icon">🏯</span>
      <h3>创作背景</h3>
    </div>
    <div class="background-content">{{创作背景}}</div>
  </div>

  <div class="author-section">
    <div class="section-header">
      <span class="section-icon">👤</span>
      <h3>作者简介</h3>
    </div>
    <div class="author-content">{{作者简介}}</div>
  </div>

  <div class="encouragement">
    <div class="trophy-icon">🏆</div>
    <p class="encourage-text">表现很棒，继续挑战更多古诗！</p>
    <p class="encourage-text-chinese">向更高分前进！</p>
  </div>

  <div class="decoration-stars">
    <div class="star star-1">⭐</div>
    <div class="star star-2">✨</div>
    <div class="star star-3">🌟</div>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('playPoemAudioBtn');
  if(btn){
    btn.addEventListener('click', function(){
      var a=document.querySelector('.audio-section audio') || document.querySelector('.audio-container audio');
      if(a){ try{ a.play(); return; }catch(e){} }
      var clickable=document.querySelector('.audio-section [onclick], .audio-section a, .audio-section button');
      if(clickable && clickable!==btn){ try{ clickable.click(); }catch(e){} }
    });
  }
})();
</script>
