<!-- AICard_英语单词 - 正面模板 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<div class="card sage-theme">
    <!-- 右上角图片显隐切换按钮（仅在有图片时显示） -->
    {{#图片}}
    <button id="toggle-img-btn" class="img-toggle-btn" title="点击显示/隐藏图片" onclick="event.stopPropagation(); toggleImageManual()">
        <svg class="eye-icon" viewBox="0 0 24 24" width="14" height="14">
            <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
        <span id="img-toggle-text">显示图片 (5s)</span>
    </button>
    {{/图片}}

    <!-- 英语单词（居中） -->
    <div class="word-container">
        <span class="word-text en-main">{{英语}}</span>
        <button class="tts-btn" title="朗读" onclick="event.stopPropagation(); playTTS(this, '{{英语}}', 'en-US-AriaNeural')">
            <svg class="speaker-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5 9.77H8.5v-2h3V6.91L7.41 11H4v2h3.41L11.5 17.09V13zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
        </button>
    </div>

    <!-- 图片区域（默认隐藏） -->
    {{#图片}}
    <div id="image-wrapper" class="image-wrapper is-hidden">
        {{图片}}
    </div>
    {{/图片}}
</div>

<script>
// 1. TTS 播放逻辑
async function playTTS(btn, text, voice) {
    if (!text || text.trim() === "") return;
    if (btn && (btn.classList.contains('loading') || btn.classList.contains('playing'))) return;

    if (btn) btn.classList.add('loading');

    try {
        const response = await fetch('https://tts.wangwangit.com/v1/audio/speech', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                input: text,
                voice: voice,
                speed: 1.0,
                pitch: "0",
                style: "general"
            })
        });

        if (!response.ok) throw new Error('TTS 请求失败');

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);

        if (btn) {
            btn.classList.remove('loading');
            btn.classList.add('playing');
        }

        return new Promise((resolve) => {
            audio.onended = () => {
                if (btn) btn.classList.remove('playing');
                resolve();
            };
            audio.onerror = () => {
                if (btn) btn.classList.remove('playing');
                resolve();
            };
            audio.play();
        });
    } catch (err) {
        console.error(err);
        if (btn) {
            btn.classList.remove('loading');
            btn.classList.remove('playing');
        }
    }
}

// 2. 图片显隐与 5 秒倒计时逻辑
let autoRevealTimer = null;
let countdownInterval = null;
let secondsLeft = 5;

function showImage() {
    const imgBox = document.getElementById('image-wrapper');
    const btnText = document.getElementById('img-toggle-text');
    const btn = document.getElementById('toggle-img-btn');
    if (imgBox) imgBox.classList.remove('is-hidden');
    if (btnText) btnText.innerText = '隐藏图片';
    if (btn) btn.classList.add('active');
    
    clearInterval(countdownInterval);
    clearTimeout(autoRevealTimer);
}

function hideImage() {
    const imgBox = document.getElementById('image-wrapper');
    const btnText = document.getElementById('img-toggle-text');
    const btn = document.getElementById('toggle-img-btn');
    if (imgBox) imgBox.classList.add('is-hidden');
    if (btnText) btnText.innerText = '显示图片';
    if (btn) btn.classList.remove('active');
    
    clearInterval(countdownInterval);
    clearTimeout(autoRevealTimer);
}

function toggleImageManual() {
    const imgBox = document.getElementById('image-wrapper');
    if (!imgBox) return;
    if (imgBox.classList.contains('is-hidden')) {
        showImage();
    } else {
        hideImage();
    }
}

// 启动 5 秒自动显示机制
const imgContainer = document.getElementById('image-wrapper');
if (imgContainer) {
    countdownInterval = setInterval(() => {
        secondsLeft--;
        const btnText = document.getElementById('img-toggle-text');
        const imgBox = document.getElementById('image-wrapper');
        if (btnText && imgBox && imgBox.classList.contains('is-hidden')) {
            if (secondsLeft > 0) {
                btnText.innerText = `显示图片 (${secondsLeft}s)`;
            }
        }
    }, 1000);

    autoRevealTimer = setTimeout(() => {
        showImage();
    }, 5000);
}
</script>
